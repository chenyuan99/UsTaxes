app-id: com.ustaxes.UsTaxes
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable
command: ustaxes
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NPM_CONFIG_LOGLEVEL: info
    CARGO_HOME: /run/build/UsTaxes/cargo
    RUST_BACKTRACE: 1
modules:
  - name: UsTaxes
    buildsystem: simple
    build-commands:
      # Set up Node environment
      - . /usr/lib/sdk/node20/enable.sh
      # Set up Rust environment
      - . /usr/lib/sdk/rust-stable/enable.sh
      # Install dependencies and build
      - npm ci
      - npm run build
      # Build Tauri app
      - cd src-tauri && cargo build --release
      # Install the application
      - mkdir -p /app/bin
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - mkdir -p /app/share/metainfo
      - cp src-tauri/target/release/ustaxes /app/bin/
      - cp -r src-tauri/icons/icon.png /app/share/icons/hicolor/256x256/apps/com.ustaxes.UsTaxes.png
      - cp flatpak/com.ustaxes.UsTaxes.desktop /app/share/applications/
      - cp flatpak/com.ustaxes.UsTaxes.metainfo.xml /app/share/metainfo/
    sources:
      - type: dir
        path: .
